name: Publicar na KingHost

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-kinghost
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enviar site/ via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.4ddesenvolvimentopessoal.com.br
          username: 4ddesenvolvimentopessoal
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./site/
          # O login do FTP da KingHost já entra em /www (pasta pública).
          server-dir: ./
